<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1f2a" />
    <title>UECC Survey</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0d1f2a; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
      .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; padding: 24px; }
      .logo { width: 96px; height: 96px; border-radius: 24px; background: linear-gradient(135deg, #1e90ff, #00d4ff); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 36px; color: #0d1f2a; box-shadow: 0 20px 60px rgba(0, 212, 255, .35); }
      .title { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
      .subtitle { font-size: 14px; opacity: .7; }
      .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.15); border-top-color: #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .err { display: none; max-width: 320px; }
      .btn { margin-top: 12px; background: linear-gradient(135deg, #1e90ff, #00d4ff); color: #0d1f2a; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">U</div>
      <div class="title">UECC Survey</div>
      <div class="spinner" id="sp"></div>
      <div class="subtitle" id="msg">جاري تحميل التطبيق...</div>
      <div class="err" id="err">
        <div class="subtitle">تعذر الاتصال بالإنترنت. يحتاج التطبيق إلى اتصال للمتابعة.</div>
        <button class="btn" onclick="go()">إعادة المحاولة</button>
      </div>
    </div>
    <script>
      var TARGET = 'https://uecc.lovable.app/';
      function go() {
        document.getElementById('err').style.display = 'none';
        document.getElementById('sp').style.display = 'block';
        document.getElementById('msg').style.display = 'block';
        if (navigator.onLine === false) { showErr(); return; }
        location.replace(TARGET);
      }
      function showErr() {
        document.getElementById('sp').style.display = 'none';
        document.getElementById('msg').style.display = 'none';
        document.getElementById('err').style.display = 'block';
      }
      window.addEventListener('online', go);
      setTimeout(go, 400);
    </script>
  </body>
</html>
